name: Scrape

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Run scrapers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The scrapers only use Node built-ins and Node strips the TypeScript
      # types natively, so no dependency install is required.
      # A single broken arena scraper must not discard the other arenas' fresh
      # data, so the step is allowed to fail and the job reports it at the end.
      - name: Run scrapers
        id: scrape
        continue-on-error: true
        run: node scraper/index.ts

      - name: Commit updated schedules
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schedule changes."
          else
            git commit -m "chore(data): refresh scraped schedules"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the default GITHUB_TOKEN do not trigger other
      # workflows, so kick off the Pages deploy explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Fail if any scraper failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "One or more arena scrapers failed; see the run log above." >&2
          exit 1
