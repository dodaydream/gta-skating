name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corepack must be enabled before setup-node: with `cache: yarn` the
      # action resolves the yarn cache by invoking `yarn` from PATH, and the
      # runner's pre-installed Yarn 1.x refuses to run against a project
      # declaring a `packageManager` field.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Resolve analytics id
        # GA4 measurement id is a public value; set the NEXT_PUBLIC_GA_ID
        # repository variable to enable analytics (unset disables it).
        env:
          GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: echo "NEXT_PUBLIC_GA_ID=$GA_ID" >> "$GITHUB_ENV"

      - name: Resolve AdSense client
        # AdSense client id is a public value; set the NEXT_PUBLIC_ADSENSE_CLIENT
        # repository variable to enable ads (unset disables them).
        env:
          ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}
        run: |
          echo "NEXT_PUBLIC_ADSENSE_CLIENT=$ADSENSE_CLIENT" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_ADSENSE_SLOT=$ADSENSE_SLOT" >> "$GITHUB_ENV"

      - name: Build static export
        run: yarn build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # v4+ excludes dotfiles by default; the export ships out/.nojekyll.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
